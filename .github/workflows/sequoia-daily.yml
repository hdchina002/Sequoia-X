name: Sequoia-X 每日选股

# 为什么挂这么多条 cron？
# GitHub Actions 的定时任务是"尽力而为"：高峰期常常延迟 10~40 分钟，偶尔整条跳过。
# 所以每 20 分钟挂一条，从北京时间 17:40 覆盖到 20:00 共 8 次。
# 由 scripts/daily_run.py 做幂等守卫：当天已成功推送就直接退出，绝不重复发群消息。
# 只有"没跑成"的那次会真正执行 —— 也就是你要的"没跑就 20 分钟后再来一次"。
#
# 时区换算：GitHub 只认 UTC，北京时间 = UTC + 8 小时
#   北京 17:40 = UTC 09:40

on:
  schedule:
    - cron: '40 9 * * 1-5'    # 北京 17:40
    - cron: '0 10 * * 1-5'    # 北京 18:00
    - cron: '20 10 * * 1-5'   # 北京 18:20
    - cron: '40 10 * * 1-5'   # 北京 18:40
    - cron: '0 11 * * 1-5'    # 北京 19:00
    - cron: '20 11 * * 1-5'   # 北京 19:20
    - cron: '40 11 * * 1-5'   # 北京 19:40
    - cron: '0 12 * * 1-5'    # 北京 20:00
  workflow_dispatch:
    inputs:
      force:
        description: '强制重跑（忽略"今日已完成"判断，会重复推送）'
        type: boolean
        default: false
      publish_baseline:
        description: '只把当前数据库固化成 Release 基线，不跑选股、不推送'
        type: boolean
        default: false

# 同一条流水线不并发：新的排队，不打断正在跑的
concurrency:
  group: sequoia-daily
  cancel-in-progress: false

permissions:
  # write 是给 Release 基线用的：回填成果要固化到 Release，不能只押在 Actions 缓存上
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    # 首次回填实测 119.6 分钟（5224 只 × 3 并发）。
    # job 上限给到 330，同时下面给"执行选股"单独设 200 分钟 step 级超时——
    # 关键：step 超时只会终止那一步，job 还活着，后面带 always() 的保存步骤仍会执行。
    # 如果只靠 job 级超时，一旦回填卡到边界，整个 job 被杀，两小时数据一起丢（踩过）。
    timeout-minutes: 330
    env:
      # Runner 默认 UTC。统一成北京时间，否则 date.today() 在跨零点时会算错一天。
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install .

      # Runner 是临时容器，跑完即销毁。SQLite 必须靠缓存跨天存活。
      # 缓存整个 data/ 目录：既包含行情库，也包含"今日已完成"的状态文件。
      # 拆成 restore / save 两步是关键：只有真正更新了数据的那一次才 save。
      # 一天 8 次 cron，如果每次都存 260MB，一周就把 10GB 免费额度撑爆。
      - name: 恢复行情数据库
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: seq-db-${{ github.run_id }}
          restore-keys: |
            seq-db-

      # ── 二级兜底：缓存被淘汰/首次部署时，从 Release 拉基线库 ──
      # 为什么必须有这一层：首次全量回填要跑约 2 小时（5224 只 × 3 并发逐只查历史）。
      # Actions 缓存 7 天不访问就会被清，跑失败也不保存 —— 一旦丢了就得重跑两小时。
      # 把回填成果压成基线挂到 Release（永久、不受缓存淘汰影响），丢了 1 分钟拉回来。
      - name: 缓存未命中时从 Release 恢复基线
        run: |
          if [ -f data/sequoia_v2.db ]; then
            echo "✅ 缓存命中，库大小 $(du -h data/sequoia_v2.db | cut -f1)"
            exit 0
          fi
          echo "缓存未命中，尝试从 Release 拉基线库……"
          mkdir -p data
          if gh release download db-baseline --pattern 'sequoia_v2.db.gz' --dir /tmp --clobber 2>/dev/null; then
            gunzip -c /tmp/sequoia_v2.db.gz > data/sequoia_v2.db
            echo "✅ 基线恢复完成，大小 $(du -h data/sequoia_v2.db | cut -f1)"
          else
            echo "⚠️ 无可用基线（首次部署），本次将执行全量回填，预计 2 小时"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 数据源连通性自检
        continue-on-error: true
        run: |
          python - <<'PY'
          import socket, time
          t = time.time()
          try:
              s = socket.create_connection(("baostock.com", 10030), timeout=15)
              s.close()
              print(f"baostock TCP 可达，耗时 {time.time()-t:.2f}s")
          except Exception as e:
              print(f"baostock TCP 探测失败：{type(e).__name__}: {e}")
          import baostock as bs
          lg = bs.login()
          print("baostock login:", lg.error_code, lg.error_msg)
          if lg.error_code == "0":
              bs.logout()
          PY

      - name: 执行每日选股
        id: run
        if: inputs.publish_baseline != true
        timeout-minutes: 200
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          # 只保留最近多少个交易日（滚动窗口，体积恒定约 260MB）
          KEEP_DAYS: '400'
          # 想给每个策略配独立机器人群时，在仓库 Secrets 里加对应变量并取消下面注释
          # STRATEGY_WEBHOOK_TURTLE: ${{ secrets.STRATEGY_WEBHOOK_TURTLE }}
          # STRATEGY_WEBHOOK_MA_VOLUME: ${{ secrets.STRATEGY_WEBHOOK_MA_VOLUME }}
          # STRATEGY_WEBHOOK_FLAG: ${{ secrets.STRATEGY_WEBHOOK_FLAG }}
          # STRATEGY_WEBHOOK_SHAKEOUT: ${{ secrets.STRATEGY_WEBHOOK_SHAKEOUT }}
          # STRATEGY_WEBHOOK_LIMIT_DOWN: ${{ secrets.STRATEGY_WEBHOOK_LIMIT_DOWN }}
          # STRATEGY_WEBHOOK_RPS: ${{ secrets.STRATEGY_WEBHOOK_RPS }}
          # STRATEGY_WEBHOOK_PRIVATE_PLACEMENT: ${{ secrets.STRATEGY_WEBHOOK_PRIVATE_PLACEMENT }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/daily_run.py --force
          else
            python scripts/daily_run.py
          fi

      # 只有数据真的变了才写入缓存。当天已推送成功的后续 cron 会跳过这里，
      # 于是每天只产生 1 份新缓存（约 260MB），月均约 5.7GB，稳在 10GB 免费额度内。
      # always() 是必须的：数据一旦入库就绝不能因为后续步骤失败而丢弃。
      # 踩过的坑：首次回填 196 万行、跑满两小时，因 403 只票失败导致整步退出非 0，
      # 这个 save 被默认跳过，成果连同缓存一起没了，只能从头再来。
      - name: 保存行情数据库
        if: always() && steps.run.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/
          key: seq-db-${{ github.run_id }}

      # 把库固化成 Release 基线附件。压缩后约 60~90MB（SQLite 数值列压缩率高）。
      # 只在数据真的更新过时覆盖，一天一次。tag 固定为 db-baseline，删旧建新，不累积。
      - name: 更新 Release 基线
        if: always() && (steps.run.outputs.updated == 'true' || inputs.publish_baseline == true)
        continue-on-error: true
        run: |
          if [ ! -f data/sequoia_v2.db ]; then echo "无数据库，跳过"; exit 0; fi
          gzip -c data/sequoia_v2.db > /tmp/sequoia_v2.db.gz
          echo "压缩后 $(du -h /tmp/sequoia_v2.db.gz | cut -f1)"
          gh release delete db-baseline --yes --cleanup-tag 2>/dev/null || true
          gh release create db-baseline /tmp/sequoia_v2.db.gz \
            --title "行情数据库基线（自动维护）" \
            --notes "每日选股后自动覆盖。用途：Actions 缓存被淘汰时快速恢复，避免重跑约 2 小时的全量回填。更新时间 $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "✅ 基线上传完成"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
